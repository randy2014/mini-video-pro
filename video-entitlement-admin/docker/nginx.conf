server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # APK 上传（管理后台走 /admin/api/...，最大 50MB）需放宽，默认 1MB 会被 413 拦掉
    client_max_body_size 60m;

    # 对外正式入口：https://xs2026.site/platform/
    # 网关（mini-novel-gateway）原样转发 /platform/...（不剥前缀），
    # 这里把前缀在容器内部剥掉，前端即以 base=/platform/ 构建，
    # 于是 http://<ip>:8082/ 与 https://xs2026.site/platform/ 两条入口都能用。
    location /platform/ {
        rewrite ^/platform/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin/api/ {
        proxy_pass http://video-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://video-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
